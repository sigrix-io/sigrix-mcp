[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sigrix-mcp"
version = "0.1.0"
description = "Publish prompt, persona and skill listings to Sigrix from the AI client you already write in — a thin MCP server over the seller API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Sigrix" }]
keywords = ["mcp", "model-context-protocol", "sigrix", "marketplace", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
sigrix-mcp = "sigrix_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/sigrix-io/sigrix-mcp"
Issues = "https://github.com/sigrix-io/sigrix-mcp/issues"
Changelog = "https://github.com/sigrix-io/sigrix-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sigrix_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/sigrix_mcp", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
