name: I depend on this
description: Not a defect. Tell us you are building on 0.x so we do not break you silently.
labels: ["dependent"]
body:
  - type: markdown
    attributes:
      value: >-
        [VERSIONING.md](https://github.com/sigrix-io/sigrix-mcp/blob/main/VERSIONING.md)
        says what a bump means here. This form is the other half of that
        bargain: the practical difference between an announced breaking change
        and a surprising one is knowing somebody is out there.
  - type: input
    id: version
    attributes:
      label: Which version are you pinned to?
      placeholder: "sigrix-mcp~=0.2.0"
    validations:
      required: true
  - type: checkboxes
    id: surface
    attributes:
      label: Which tools do you actually call?
      description: >-
        A tool's name and its request body are the contract the models you run
        are written against. This is what tells us which change would cost you
        something.
      options:
        - label: "`list_categories` / `list_my_listings` / `get_listing`"
        - label: "`create_draft` / `update_draft`"
        - label: "`check_draft` / `submit_for_review`"
        - label: "`import_skill_md` / `export_skill_md`"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else worth knowing
      description: >-
        Which MCP client, whether you drive it from a script rather than a
        model, and whether a change to a *tool description* would be a problem
        for you. No obligation to name your project.
    validations:
      required: false
