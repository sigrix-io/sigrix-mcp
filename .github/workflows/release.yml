name: Release

# Trusted publishing: PyPI trusts this repository's `release.yml` in the
# `pypi` environment, so no API token is stored anywhere and nothing here
# reads a secret. Both sides of that trust have to exist before the first
# tag — the publisher on PyPI and the environment in this repository's
# settings. VERSIONING.md § Releasing has the two of them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install --upgrade build && python -m build
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned to the commit rather than to `release/v1`, which is a *branch*:
      # it moves whenever upstream pushes, and nothing in this repository would
      # record that it had. That matters here and nowhere else in this file —
      # this is the one step holding upload rights to PyPI, through the OIDC
      # token the permission above mints. The SHA is what `release/v1` points
      # at today, so this freezes what already runs rather than changing it,
      # and it is the same one `sigrix-io/mullion` and `sigrix-io/postern` pin.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
